[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "artifexian-auto-worldgen"
version = "0.4.0"
description = "Hierarchical tectonic, climate, fluvial landscape-evolution and worldbuilding generator reconstructed from Artifexian Worldbuilder's Log workflows."
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "matplotlib>=3.8",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
performance = [
  "numexpr>=2.10",
  "bottleneck>=1.4",
  "psutil>=6.0",
  "threadpoolctl>=3.5",
  "joblib>=1.4",
]
jit = [
  "numba>=0.61",
]
storage = [
  "zarr>=3.0",
  "numcodecs>=0.16",
  "h5py>=3.11",
]
scientific = [
  "xarray>=2025.1",
  "pyamg>=5.2",
]
gis = [
  "rasterio>=1.4",
  "pyarrow>=18.0",
]
render = [
  "Pillow>=10.4",
]
dev = [
  "pytest>=8.0",
  "hypothesis>=6.0",
  "pytest-benchmark>=5.0",
  "ruff>=0.9",
  "mypy>=1.14",
  "build>=1.2",
]

[project.scripts]
worldgen = "worldgen.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 120

[project.urls]
Homepage = "https://github.com/jerrecode/artifexian_auto_worldgen"
Repository = "https://github.com/jerrecode/artifexian_auto_worldgen"
Issues = "https://github.com/jerrecode/artifexian_auto_worldgen/issues"
