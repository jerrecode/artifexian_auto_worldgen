[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "artifexian-auto-worldgen"
version = "0.2.0"
description = "Hierarchical tectonic, climate, fluvial landscape-evolution and worldbuilding generator reconstructed from Artifexian Worldbuilder's Log workflows."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "matplotlib>=3.8",
  "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/jerrecode/artifexian_auto_worldgen"
Repository = "https://github.com/jerrecode/artifexian_auto_worldgen"
Issues = "https://github.com/jerrecode/artifexian_auto_worldgen/issues"

[project.scripts]
worldgen = "worldgen.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
