name: Z2 audit fix targeted production validation

on:
  push:
    branches:
      - fix-z2-river-seam-audits
    paths:
      - '.github/workflows/z2-audit-fix-targeted.yml'
      - 'src/worldgen/ultrares.py'
      - 'src/worldgen/local_geomorphology.py'
      - 'src/worldgen/local_hydrology.py'
      - 'tests/test_ultrares.py'
      - 'tests/test_local_hydrology.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: z2-audit-fix-targeted-${{ github.ref }}
  cancel-in-progress: true

env:
  MPLBACKEND: Agg
  WORLDGEN_DISTANCE_CACHE_MB: '128'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_MAX_THREADS: '1'
  NUMBA_CACHE_DIR: ${{ github.workspace }}/.numba-cache
  SEED: '2026090707'
  ROOT: output/earthlike-ultrares-2026090707

jobs:
  targeted:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install production stack
        run: |
          set -euxo pipefail
          python -m pip install --disable-pip-version-check -e '.[performance,jit,storage,thermodynamics,render,dev]'
          python -m pip check
      - name: Restore preserved compact source authority from failed production
        uses: actions/download-artifact@v4
        with:
          name: earthlike-ultrares-source-2026090707
          path: ${{ env.ROOT }}
          github-token: ${{ github.token }}
          run-id: 34353489700
      - name: Regenerate only the measured river problem tile
        shell: bash
        run: |
          set -euxo pipefail
          # _level_keys(z2) ordinal 55 = ny/z2/x3/y1, the measured
          # production straight-run outlier. shard_count=96 selects exactly one tile.
          for ordinal in 55; do
            /usr/bin/time -v python scripts/run_ultrares_earth.py "$ROOT" \
              --mode shard \
              --no-compact \
              --workers 2 \
              --tile-size 1024 \
              --base-multiplier 4 \
              --subsection-multiplier 2 \
              --min-samples-per-wavelength 4 \
              --terrain-detail-strength 1.15 \
              --shard-index "$ordinal" \
              --shard-count 96 \
              2>&1 | tee "$ROOT/targeted-tile-${ordinal}.log"
          done
      - name: Validate measured production failure locations
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          import numpy as np

          from worldgen.planet_tiles import TileKey, TilePyramidSpec
          from worldgen.ultrares import (
              UltraResolutionTilePyramid,
              _geomorph_path,
          )

          root = Path(os.environ["ROOT"])
          pyramid = UltraResolutionTilePyramid(
              root,
              spec=TilePyramidSpec(
                  tile_size=1024,
                  elevation_detail_strength=1.15,
                  detail_hurst_exponent=0.65,
                  detail_harmonics=1,
                  maximum_level=12,
              ),
          )

          def elevation(key):
              return np.asarray(
                  np.load(
                      _geomorph_path(pyramid, key, "elevation_m"),
                      mmap_mode="r",
                      allow_pickle=False,
                  ),
                  dtype=np.float64,
              )

          def metadata(key):
              p = (
                  pyramid.root / "derived" / "local_geomorphology_v1" / "metadata"
                  / f"z{key.level:02d}" / key.face
                  / f"x{key.x:08d}" / f"y{key.y:08d}.json"
              )
              return json.loads(p.read_text(encoding="utf-8"))

          river_key = TileKey("ny", 2, 3, 1)
          river = metadata(river_key)["final_routing_metrics"]
          river_meta = metadata(river_key)
          report = {
              "river_problem_tile": {
                  "key": "ny/z2/x3/y1",
                  "max_straight_run_cells": int(river["max_straight_run_cells"]),
                  "turn_fraction_gt10deg": float(river["stream_turn_fraction_gt10deg"]),
                  "median_sinuosity": river["median_sampled_sinuosity"],
                  "adaptive_meander_attempt": river_meta.get("adaptive_meander_attempt"),
                  "routing_candidate_metrics": river_meta.get("routing_candidate_metrics"),
              },
          }
          out = root / "targeted-z2-fix-validation.json"
          out.write_text(json.dumps(report, indent=2, sort_keys=True), encoding="utf-8")
          print(json.dumps(report, indent=2, sort_keys=True))

          assert report["river_problem_tile"]["max_straight_run_cells"] <= 220, report
          PY
      - name: Upload targeted validation diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: z2-audit-fix-targeted-validation
          retention-days: 14
          compression-level: 6
          if-no-files-found: warn
          path: |
            ${{ env.ROOT }}/targeted-z2-fix-validation.json
            ${{ env.ROOT }}/targeted-tile-*.log
            ${{ env.ROOT }}/ultrares/telemetry/
