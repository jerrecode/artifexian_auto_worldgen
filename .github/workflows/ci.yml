name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest build
          python -m pip check

      - name: Compile all Python sources
        run: python -m compileall -q src tests scripts

      - name: CLI contract smoke test
        run: |
          worldgen --help >/tmp/worldgen-help.txt
          worldgen --version
          python -m worldgen --help >/tmp/worldgen-module-help.txt
          python -m worldgen --dry-run --no-progress --resolution 128x64 --workers 1
          test -s /tmp/worldgen-help.txt
          test -s /tmp/worldgen-module-help.txt

      - name: Run full test suite
        run: pytest -q

      - name: Verify distributable package build
        if: matrix.python-version == '3.11'
        run: python -m build

  optional-backends:
    name: Optional performance/JIT/storage backends
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install all optional runtime backends
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[performance,jit,storage,render]'
          python -m pip install pytest
          python -m pip check

      - name: Verify optional backends are importable
        run: |
          python - <<'PY'
          from worldgen.runtime import optional_backend_status
          status = optional_backend_status()
          required = {"numba", "numexpr", "bottleneck", "psutil", "zarr", "h5py", "PIL"}
          missing = sorted(name for name in required if not status.get(name, False))
          print(status)
          if missing:
              raise SystemExit(f"optional backends missing after extras install: {missing}")
          PY

      - name: Exercise JIT and optional-backend code paths
        run: pytest -q
