name: Publish Earth-like ultra-resolution maps release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-earthlike-ultrares-release.yml"

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SOURCE_RUN_ID: "34096567870"
      TAG: "earthlike-ultrares-2026090707"
      TARGET_SHA: "d5c97b62bed070bdab0ca72913952405dde51f4f"
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Download exact successful workflow artifacts
        uses: actions/download-artifact@v5
        with:
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}
          path: release-assets

      - name: Verify expected artifact payload
        shell: bash
        run: |
          set -euxo pipefail
          find release-assets -type f -printf '%p\t%s bytes\n' | sort | tee release-files.txt
          test "$(find release-assets -type f -name '*.png' | wc -l)" -ge 38
          test -n "$(find release-assets -type f -name '01_terrain_heightmap_grayscale16.png' -print -quit)"
          test -n "$(find release-assets -type f -name '19_true_color_refined.png' -print -quit)"
          test -n "$(find release-assets -type f -name '30_resources_dominant_with_legend.png' -print -quit)"

      - name: Create release
        shell: bash
        run: |
          set -euxo pipefail
          cat > release-notes.md <<'EOF'
          Earth-like ultra-resolution world, seed 2026090707.

          Generated by successful workflow run 34096567870.

          Resolution hierarchy:
          - globally coupled physical source: 2048x1024
          - rebuilt full-view maps: 8192x4096
          - deepest terrain authority: 96 z2 cube-sphere tiles, another ~2x finer in characteristic ground sampling

          The 8192x4096 maps are reconstructed from the deepest solved tiles rather than produced by image upscaling. Legacy stream-power/sediment erosion and phase-cell procedural erosion were both applied and the ultra-resolution audit passed.

          Assets are the original generated PNG files from that successful run. No image-generation model was used.
          EOF
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY"               --title "Earth-like Ultra-resolution Planet — seed 2026090707"               --notes-file release-notes.md
          else
            gh release create "$TAG"               --repo "$GITHUB_REPOSITORY"               --target "$TARGET_SHA"               --title "Earth-like Ultra-resolution Planet — seed 2026090707"               --notes-file release-notes.md
          fi

      - name: Upload every full-view PNG as an individual release asset
        shell: bash
        run: |
          set -euxo pipefail
          mapfile -d '' files < <(find release-assets -type f -name '*.png' -print0 | sort -z)
          printf 'Uploading %d PNG assets\n' "${#files[@]}"
          for ((i=0; i<${#files[@]}; i+=8)); do
            batch=("${files[@]:i:8}")
            gh release upload "$TAG" "${batch[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          done

      - name: Upload map metadata and scientific audits
        shell: bash
        run: |
          set -euxo pipefail
          declare -a wanted=()
          while IFS= read -r -d '' f; do wanted+=("$f"); done < <(
            find release-assets -type f \(               -name 'map_manifest.json' -o               -name '01_terrain_heightmap_grayscale16.json' -o               -name 'terrain_detail_audit.json' -o               -name 'plan.json' -o               -name 'reconstruction.json' -o               -name 'authority_compaction.json' -o               -name 'source_scientific_audit.json' -o               -name 'source_optics_audit.json'             \) -print0 | sort -z
          )
          declare -A seen=()
          for f in "${wanted[@]}"; do
            base="$(basename "$f")"
            if [[ -n "${seen[$base]:-}" ]]; then
              continue
            fi
            seen[$base]=1
            gh release upload "$TAG" "$f" --clobber --repo "$GITHUB_REPOSITORY"
          done

      - name: Verify published release assets
        shell: bash
        run: |
          set -euxo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY"             --json url,tagName,targetCommitish,assets > release-verification.json
          cat release-verification.json
          python - <<'PY'
          import json
          obj=json.load(open("release-verification.json"))
          names={a["name"] for a in obj["assets"]}
          required={
              "00_terrain_relief.png",
              "01_terrain_heightmap_grayscale16.png",
              "04_rivers_deepest_tiles.png",
              "07_temperature_annual_heatmap.png",
              "09_humidity_proxy_annual.png",
              "14_vegetation_fraction.png",
              "17_biome_ecoregime_with_legend.png",
              "18_koppen_climate_with_legend.png",
              "19_true_color_refined.png",
              "20_erosion_legacy_stream_power.png",
              "21_erosion_procedural_phase_cell.png",
              "22_erosion_combined_geomorphic_delta.png",
              "23_weather_hazards_with_legend.png",
              "30_resources_dominant_with_legend.png",
          }
          missing=sorted(required-names)
          assert not missing, missing
          assert sum(n.endswith(".png") for n in names) >= 38
          print(f"published assets={len(names)} png={sum(n.endswith('.png') for n in names)}")
          PY
