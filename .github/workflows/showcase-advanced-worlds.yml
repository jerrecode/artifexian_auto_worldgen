name: Regenerate advanced Super-Earth and Titan showcases

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/showcase-advanced-worlds.yml'

permissions:
  contents: read

jobs:
  generate-and-audit:
    name: ${{ matrix.label }} 2048x1024
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Super-Earth
            slug: super-earth
            config: config/super_earth.yaml
          - label: Titan
            slug: titan
            config: config/titan_like.yaml
    env:
      MPLBACKEND: Agg
      WORLDGEN_DISTANCE_CACHE_MB: '96'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_MAX_THREADS: '1'
      NUMBA_CACHE_DIR: ${{ github.workspace }}/.numba-cache
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install production and audit backends
        run: |
          python -m pip install --disable-pip-version-check -e '.[performance,jit,thermodynamics,render]'
          python -m pip check
          worldgen --runtime-info --dry-run --config '${{ matrix.config }}' --resolution 2048x1024 --workers 4

      - name: Generate ${{ matrix.label }} at 2048x1024
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p 'showcase/${{ matrix.slug }}'
          worldgen generate \
            --config '${{ matrix.config }}' \
            --out 'showcase/${{ matrix.slug }}' \
            --resolution 2048x1024 \
            --workers 4 \
            --worker-cap 4 \
            --threads-per-worker 1 \
            --memory-per-worker-mb 1024 \
            --checkpoint-dir 'showcase/${{ matrix.slug }}/checkpoints' \
            --checkpoint-max-gb 18 \
            --timings-json 'showcase/${{ matrix.slug }}/timings_cli.json' \
            --progress-detail -vv \
            --log-file 'showcase/${{ matrix.slug }}/generation.log'

      - name: Run physical/numerical audit
        shell: bash
        run: |
          set -euxo pipefail
          python scripts/audit_generated_world.py \
            'showcase/${{ matrix.slug }}' \
            --output 'showcase/${{ matrix.slug }}/showcase_audit.json' \
            | tee 'showcase/${{ matrix.slug }}/showcase_audit.log'

      - name: Enforce showcase invariants
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          slug='${{ matrix.slug }}'
          root=Path('showcase')/slug
          diag=json.loads((root/'diagnostics.json').read_text())
          audit=json.loads((root/'showcase_audit.json').read_text())
          failures=[]
          if not diag.get('all_invariants_passed',False):
              failures.append('diagnostics.json contains failed scientific/numerical invariants')
          h=audit['hydrology']; c=audit['conservation']; d=audit['saved_diagnostics']
          if h.get('river_cells_on_ocean',0)!=0:
              failures.append(f"{h['river_cells_on_ocean']} resolved river cells lie on ocean")
          if h.get('unassigned_land_cells',0)!=0:
              failures.append(f"{h['unassigned_land_cells']} land cells have no terminal watershed")
          wr=c.get('water_balance_max_abs_residual_mm_year')
          if wr is not None and abs(float(wr))>0.05:
              failures.append(f'water-balance closure residual too large: {wr}')
          cr=c.get('condensate_mass_partition_relative_l1_residual')
          if cr is not None and abs(float(cr))>1e-6:
              failures.append(f'condensate mass partition residual too large: {cr}')
          sr=c.get('sediment_routing_relative_residual')
          if sr is not None and abs(float(sr))>1e-6:
              failures.append(f'sediment routing residual too large: {sr}')
          if d.get('invariant_failures'):
              failures.append(f"saved invariant failures: {d['invariant_failures']}")
          if h.get('terminal_watershed_count',0)<=0:
              failures.append('no terminal watersheds resolved')
          if failures:
              raise SystemExit('\n'.join(failures))
          print(json.dumps({
              'world':slug,
              'resolution':[audit['grid']['width'],audit['grid']['height']],
              'land_fraction':audit['grid']['land_area_fraction'],
              'watersheds':h.get('terminal_watershed_count'),
              'max_strahler_order':h.get('max_strahler_order'),
              'mean_runoff_mm_year':h.get('mean_land_runoff_mm_year'),
              'mean_erosion_m':audit['landscape']['mean_land_cumulative_erosion_m'],
              'erosion_relief_ratio':audit['landscape']['mean_erosion_to_relief_ratio'],
              'runoff_erosion_corr':audit['landscape']['runoff_erosion_correlation'],
              'condensates':audit['multicondensate']['active_hydrologic_species'],
          },indent=2))
          PY

      - name: Build compact showcase artifact
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          ROOT='showcase/${{ matrix.slug }}'
          PKG='showcase-artifact-${{ matrix.slug }}'
          mkdir -p "$PKG/maps"
          for f in world.json world_report.md diagnostics.json run_manifest.json timings.json timings_cli.json advanced_planetary_physics.json surface_liquids.json showcase_audit.json showcase_audit.log generation.log; do
            [ ! -f "$ROOT/$f" ] || cp "$ROOT/$f" "$PKG/"
          done
          if [ -d "$ROOT/maps" ]; then
            # Preserve visual evidence while avoiding the multi-GB numerical archive.
            cp -a "$ROOT/maps/." "$PKG/maps/"
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np
          slug='${{ matrix.slug }}'
          root=Path('showcase')/slug
          out=Path('showcase-artifact-'+slug)
          with np.load(root/'world_arrays.npz',allow_pickle=False) as z:
              inv={k:{'shape':list(z[k].shape),'dtype':str(z[k].dtype),'nbytes':int(z[k].nbytes)} for k in z.files}
              keys=list(z.files)
          (out/'world_arrays_inventory.json').write_text(json.dumps({'keys':keys,'arrays':inv},indent=2))
          PY
          find "$PKG" -type f -printf '%P\t%s\n' | sort > "$PKG/file_inventory.tsv"
          du -sh "$PKG"

      - name: Upload compact ${{ matrix.label }} audit/maps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: advanced-${{ matrix.slug }}-2048x1024-audit
          path: showcase-artifact-${{ matrix.slug }}/
          compression-level: 6
          retention-days: 10
          if-no-files-found: error
