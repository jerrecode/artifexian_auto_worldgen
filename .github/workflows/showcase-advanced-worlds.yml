name: Max-complexity atmogen validation

on:
  workflow_dispatch:
  push:
    branches:
      - 'chatgpt/max-complexity-atmogen-test-20260902'
    paths:
      - '.github/workflows/showcase-advanced-worlds.yml'

permissions:
  contents: read

jobs:
  generate-and-audit:
    name: max-realism seed ${{ matrix.seed }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        seed: [435916837, 601204923]
    env:
      MPLBACKEND: Agg
      WORLDGEN_DISTANCE_CACHE_MB: '128'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_MAX_THREADS: '1'
      NUMBA_CACHE_DIR: ${{ github.workspace }}/.numba-cache
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install worldgen, atmogen and validation backends
        run: |
          python -m pip install --disable-pip-version-check -e '.[performance,jit,thermodynamics,render]'
          python -m pip check
          python - <<'PY'
          import json
          from worldgen.atmogen_adapter import atmogen_runtime_metadata
          print(json.dumps(atmogen_runtime_metadata(), indent=2, sort_keys=True))
          PY

      - name: Run atmogen integration tests
        run: |
          python -m pytest -q tests/test_atmogen_integration.py tests/test_atmogen_coupling.py

      - name: Validate maximum-realism runtime plan
        run: |
          worldgen --runtime-info --dry-run \
            --config config/maximal_realism_safe.yaml \
            --seed '${{ matrix.seed }}' \
            --set atmogen.enabled=true \
            --set atmogen.fidelity=REFERENCE \
            --set atmogen.chemistry_mode=equilibrium \
            --set atmogen.vertical_layers=64 \
            --set atmogen.representative_column_count=16 \
            --set atmogen.allow_fidelity_fallback=true \
            --workers 4 --worker-cap 4 --threads-per-worker 1

      - name: Generate maximum-complexity planet with atmogen
        shell: bash
        run: |
          set -euxo pipefail
          ROOT='showcase/max-${{ matrix.seed }}'
          mkdir -p "$ROOT"
          /usr/bin/time -v worldgen generate \
            --config config/maximal_realism_safe.yaml \
            --seed '${{ matrix.seed }}' \
            --set atmogen.enabled=true \
            --set atmogen.fidelity=REFERENCE \
            --set atmogen.chemistry_mode=equilibrium \
            --set atmogen.vertical_layers=64 \
            --set atmogen.representative_column_count=16 \
            --set atmogen.allow_fidelity_fallback=true \
            --out "$ROOT" \
            --workers 4 \
            --worker-cap 4 \
            --threads-per-worker 1 \
            --memory-per-worker-mb 1400 \
            --checkpoint-dir "$ROOT/checkpoints" \
            --checkpoint-max-gb 24 \
            --timings-json "$ROOT/timings_cli.json" \
            --progress-detail -vv \
            --log-file "$ROOT/generation.log"

      - name: Run physical and numerical audit
        run: |
          ROOT='showcase/max-${{ matrix.seed }}'
          python scripts/audit_generated_world.py "$ROOT" --output "$ROOT/showcase_audit.json" | tee "$ROOT/showcase_audit.log"
          python scripts/audit_planetary_optics.py "$ROOT" --output "$ROOT/planetary_optics_audit.json" --enforce | tee "$ROOT/planetary_optics_audit.log"

      - name: Enforce atmogen provenance and summarize outcome
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('showcase/max-${{ matrix.seed }}')
          manifest=json.loads((root/'run_manifest.json').read_text())
          diag=json.loads((root/'diagnostics.json').read_text())
          audit=json.loads((root/'showcase_audit.json').read_text())
          optics=json.loads((root/'planetary_optics_audit.json').read_text())
          atm=manifest.get('atmogen', {})
          if not atm.get('enabled'):
              raise SystemExit('atmogen was not enabled in run manifest')
          if not atm.get('version'):
              raise SystemExit(f'atmogen runtime metadata missing: {atm}')
          if not diag.get('all_invariants_passed', False):
              raise SystemExit(f"diagnostics invariants failed: {diag.get('invariant_failures')}")
          if not optics.get('all_invariants_passed', False):
              raise SystemExit(f"optics invariants failed: {optics.get('invariants')}")
          h=audit.get('hydrology', {})
          summary={
              'seed': manifest['seed'],
              'resolution': manifest['resolution'],
              'atmogen': atm,
              'stage_seconds': manifest.get('stage_seconds', {}),
              'land_fraction': audit.get('grid', {}).get('land_area_fraction'),
              'terminal_watersheds': h.get('terminal_watershed_count'),
              'max_strahler_order': h.get('max_strahler_order'),
              'mean_land_runoff_mm_year': h.get('mean_land_runoff_mm_year'),
              'mean_land_cumulative_erosion_m': audit.get('landscape', {}).get('mean_land_cumulative_erosion_m'),
              'runoff_erosion_correlation': audit.get('landscape', {}).get('runoff_erosion_correlation'),
              'active_hydrologic_species': audit.get('multicondensate', {}).get('active_hydrologic_species'),
              'mean_haze_optical_depth': optics.get('atmosphere', {}).get('mean_haze_optical_depth'),
              'mean_top_of_atmosphere_rgb': optics.get('atmosphere', {}).get('mean_top_of_atmosphere_rgb'),
              'invariant_failures': diag.get('invariant_failures', []),
          }
          (root/'max_complexity_summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True))
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Upload compact validation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: max-complexity-atmogen-${{ matrix.seed }}
          path: |
            showcase/max-${{ matrix.seed }}/run_manifest.json
            showcase/max-${{ matrix.seed }}/diagnostics.json
            showcase/max-${{ matrix.seed }}/timings.json
            showcase/max-${{ matrix.seed }}/timings_cli.json
            showcase/max-${{ matrix.seed }}/world.json
            showcase/max-${{ matrix.seed }}/world_report.md
            showcase/max-${{ matrix.seed }}/showcase_audit.json
            showcase/max-${{ matrix.seed }}/planetary_optics_audit.json
            showcase/max-${{ matrix.seed }}/max_complexity_summary.json
            showcase/max-${{ matrix.seed }}/generation.log
            showcase/max-${{ matrix.seed }}/maps/
          compression-level: 6
          retention-days: 10
          if-no-files-found: warn
