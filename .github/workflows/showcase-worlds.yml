name: Requested refined planetary worlds

on:
  workflow_dispatch:
  push:
    branches:
      - gpt56/atmogen-integration-20260828
    paths:
      - .github/workflows/showcase-worlds.yml

permissions:
  contents: read

concurrency:
  group: requested-worlds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: Generate ${{ matrix.world }} + 2 refinements + z2 tiles
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - world: titan-like
            preset: config/titan_like.yaml
          - world: super-earth
            preset: config/super_earth.yaml

    env:
      WORLD_NAME: ${{ matrix.world }}
      PRESET: ${{ matrix.preset }}
      OUT: showcase-${{ matrix.world }}

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[performance,jit,render,thermodynamics]'
          python -m pip install pytest
          python -m pip check

      - name: Run targeted regression gates
        run: |
          pytest -q \
            tests/test_low_speed_tectonics.py \
            tests/test_refinement.py \
            tests/test_planet_tiles.py \
            tests/test_precompute.py \
            tests/test_precompute_cli.py \
            tests/test_tile_memory.py \
            tests/test_tile_runtime.py

      - name: Generate 256x128 physical base world with atmogen
        run: |
          set -euxo pipefail
          rm -rf "$OUT"
          /usr/bin/time -v worldgen \
            --config "$PRESET" \
            --resolution 256x128 \
            --set atmogen.enabled=true \
            --set atmogen.fidelity=STANDARD \
            --set atmogen.representative_column_count=4 \
            --set atmogen.allow_fidelity_fallback=true \
            --out "$OUT" \
            --workers 2 \
            --worker-cap 2 \
            --threads-per-worker 1 \
            --parallel-backend thread \
            --compress-npz \
            --diagnostics \
            --manifest \
            --hash-outputs \
            --max-png-megapixels 24 \
            --timings-json "$OUT/timings-base.json" \
            --log-file "$OUT/run.jsonl" \
            --log-json \
            --no-progress \
            2>&1 | tee "$OUT-generation.log"

      - name: Recursively upscale/refine twice at 2x per level
        run: |
          set -euxo pipefail
          /usr/bin/time -v worldgen \
            --refine \
            --out "$OUT" \
            --refine-levels 2 \
            --refine-scale 2 \
            --refine-sections 2x2 \
            --refine-halo-cells 8 \
            --refine-elevation-detail-strength 0.20 \
            --no-refine-keep-sections \
            --no-progress \
            2>&1 | tee "$OUT-refinement.log"

      - name: Promote refinement level 2 as authoritative tile source
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, os, shutil
          import numpy as np

          root = Path(os.environ['OUT'])
          manifest = json.loads((root / 'refinement' / 'manifest.json').read_text())
          deepest = int(manifest['deepest_complete_level'])
          if deepest != 2:
              raise SystemExit(f'expected deepest refinement level 2, got {deepest}')
          level_dir = root / 'refinement' / 'levels' / 'level_0002'
          index = json.loads((level_dir / 'index.json').read_text())
          if list(index['resolution']) != [1024, 512]:
              raise SystemExit(f"unexpected level-2 resolution: {index['resolution']}")

          tile_source = root / 'refined-z2-source'
          tile_source.mkdir(parents=True, exist_ok=True)
          arrays = {}
          missing = []
          for name in sorted(index['entries']):
              path = level_dir / 'arrays' / f'{name}.npy'
              if not path.exists():
                  missing.append(name)
                  continue
              arrays[name] = np.load(path, mmap_mode='r', allow_pickle=False)
          if missing:
              raise SystemExit(f'missing composed refinement arrays: {missing}')
          if 'lat' not in arrays or 'lon' not in arrays or 'elevation_km' not in arrays:
              raise SystemExit('refinement level lacks required lat/lon/elevation arrays')

          np.savez_compressed(tile_source / 'world_arrays.npz', **arrays)
          for name in ('world.json', 'features.geojson', 'diagnostics.json', 'run_manifest.json'):
              src = root / name
              if src.exists():
                  shutil.copy2(src, tile_source / name)
          (tile_source / 'refined_source.json').write_text(json.dumps({
              'schema_version': 1,
              'source_world': str(root),
              'refinement_level': 2,
              'resolution': [1024, 512],
              'refinement_scale_per_level': 2,
              'refinement_levels': 2,
              'field_count': len(arrays),
          }, indent=2, sort_keys=True), encoding='utf-8')
          print(f'promoted {len(arrays)} arrays to {tile_source}')
          PY

      - name: Precompute complete cube-sphere tile prefix through z2
        run: |
          set -euxo pipefail
          worldgen-tiles \
            --world "$OUT/refined-z2-source" \
            --tile-size 64 \
            --maximum-level 12 \
            --precompute-depth 2 \
            --precompute-workers 4 \
            --precompute-max-tiles 1000 \
            --precompute-max-gib 8 \
            --mesh \
            --height-png \
            --true-color-png \
            --precompute-all-derived \
            --json \
            > "$OUT/refined-z2-source/precompute-result.json"

      - name: Validate base, refinement, static tiles, seams and RAM unload
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, os
          import numpy as np

          from worldgen.planet_tiles import PlanetTilePyramid, TileKey, TilePyramidSpec
          from worldgen.tile_runtime import PlanetTileRuntime

          root = Path(os.environ['OUT'])
          diagnostics = json.loads((root / 'diagnostics.json').read_text())
          if diagnostics.get('all_invariants_passed') is not True:
              raise SystemExit(f'base-world scientific invariants failed: {diagnostics}')

          manifest = json.loads((root / 'refinement' / 'manifest.json').read_text())
          assert int(manifest['deepest_complete_level']) == 2, manifest
          assert manifest['levels']['1']['resolution'] == [512, 256], manifest['levels']['1']
          assert manifest['levels']['2']['resolution'] == [1024, 512], manifest['levels']['2']

          source = root / 'refined-z2-source'
          result = json.loads((source / 'precompute-result.json').read_text())
          assert result['precompute_plan']['tile_count'] == 126, result
          assert result['precompute']['total_tiles'] == 126, result
          assert result['precompute']['completed_tiles'] == 126, result

          pin = json.loads((source / 'tiles' / 'cubesphere_v1' / 'precompute' / 'pinned_prefix.json').read_text())
          assert pin['maximum_level'] == 2, pin
          tileset = json.loads((source / 'tiles' / 'cubesphere_v1' / 'tileset.json').read_text())
          assert tileset['source_resolution'] == [1024, 512], tileset
          assert tileset['tile_size'] == 64, tileset

          elevation_files = list((source / 'tiles' / 'cubesphere_v1' / 'fields' / 'elevation_m').glob('z*/*/x*/y*.npy'))
          metadata_files = list((source / 'tiles' / 'cubesphere_v1' / 'metadata').glob('z*/*/x*/y*.json'))
          assert len(elevation_files) == 126, len(elevation_files)
          assert len(metadata_files) == 126, len(metadata_files)

          spec = TilePyramidSpec(tile_size=64, maximum_level=12).validate()
          pyramid = PlanetTilePyramid(source, spec=spec)
          left = np.asarray(pyramid.load_field(TileKey('px', 2, 1, 1), 'elevation_m'))
          right = np.asarray(pyramid.load_field(TileKey('px', 2, 2, 1), 'elevation_m'))
          assert np.array_equal(left[:, -1], right[:, 0]), 'same-face z2 seam mismatch'
          assert np.isfinite(left).all() and np.isfinite(right).all()

          runtime = PlanetTileRuntime(
              pyramid,
              disk_cache_max_bytes=1,
              memory_cache_max_bytes=128 * 1024,
          )
          key = TileKey('px', 2, 1, 1)
          backing = pyramid._field_path(key, 'elevation_m')
          loaded = runtime.load_field(key, 'elevation_m')
          assert loaded.flags.writeable is False
          assert backing.exists()
          runtime.release_field(key, 'elevation_m')
          runtime.clear_memory_cache()
          assert backing.exists(), 'RAM unload deleted pinned static tile file'
          assert runtime.cache_stats().pinned_maximum_level == 2

          with np.load(source / 'world_arrays.npz', allow_pickle=False) as z:
              assert z['elevation_km'].shape == (512, 1024)
              assert np.isfinite(z['elevation_km']).all()
              assert np.isfinite(z['annual_temperature_c']).all()

          summary = {
              'world': os.environ['WORLD_NAME'],
              'base_resolution': [256, 128],
              'refinement_1_resolution': [512, 256],
              'refinement_2_resolution': [1024, 512],
              'tile_prefix_depth': 2,
              'tile_count': 126,
              'tile_size': 64,
              'static_tile_files_verified': True,
              'ram_unload_preserves_static_files': True,
              'same_face_seam_verified': True,
          }
          (root / 'requested-build-summary.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True), encoding='utf-8'
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Inventory generated output
        run: |
          du -sh "$OUT" || true
          find "$OUT/refined-z2-source/tiles/cubesphere_v1" -type f | wc -l
          cat "$OUT/requested-build-summary.json"

      - name: Upload complete requested world artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.world }}-base256-refined2x2-z2tiles
          path: |
            showcase-${{ matrix.world }}/
            showcase-${{ matrix.world }}-generation.log
            showcase-${{ matrix.world }}-refinement.log
          if-no-files-found: error
          compression-level: 6
          retention-days: 14
