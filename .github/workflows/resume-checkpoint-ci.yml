name: Ultrares resumability validation

on:
  push:
    branches:
      - ultrares-resumable-shards
    paths:
      - '.github/workflows/resume-checkpoint-ci.yml'
      - '.github/workflows/generate-earthlike-ultrares.yml'
      - 'src/worldgen/ultrares.py'
      - 'src/worldgen/progress_telemetry.py'
      - 'src/worldgen/local_geomorphology.py'
      - 'scripts/run_ultrares_earth.py'
      - 'tests/test_ultrares.py'
      - 'tests/test_progress_telemetry.py'
  pull_request:
    paths:
      - '.github/workflows/generate-earthlike-ultrares.yml'
      - 'src/worldgen/ultrares.py'
      - 'src/worldgen/progress_telemetry.py'
      - 'src/worldgen/local_geomorphology.py'
      - 'src/worldgen/local_hydrology.py'
      - 'src/worldgen/river_constraints.py'
      - 'scripts/run_ultrares_earth.py'
      - 'tests/test_ultrares.py'
      - 'tests/test_progress_telemetry.py'
      - 'tests/test_local_geomorphology.py'
      - 'tests/test_local_hydrology.py'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_MAX_THREADS: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test stack
        run: |
          set -euxo pipefail
          python -m pip install --disable-pip-version-check -e '.[performance,jit,storage,thermodynamics,render,dev]'
          python -m pip check
      - name: Compile changed Python
        run: |
          set -euxo pipefail
          python -m py_compile src/worldgen/ultrares.py src/worldgen/progress_telemetry.py src/worldgen/local_geomorphology.py scripts/run_ultrares_earth.py tests/test_ultrares.py tests/test_progress_telemetry.py
      - name: Run ultra-resolution, timing, hydrology, and erosion regression gates
        run: |
          set -euxo pipefail
          python -m pytest -q \
            tests/test_ultrares.py \
            tests/test_progress_telemetry.py \
            tests/test_ultrares_maps.py \
            tests/test_heightmap.py \
            tests/test_local_geomorphology.py \
            tests/test_local_hydrology.py \
            tests/test_refinement.py \
            tests/test_procedural_erosion.py \
            tests/test_erosion_forcing.py \
            tests/test_pipeline_procedural_erosion.py \
            tests/test_diagnostics_surface_liquids.py
