name: Z2 river and seam fix CI

on:
  push:
    branches:
      - z2-river-seam-audit-fix
    paths:
      - '.github/workflows/z2-river-seam-fix-ci.yml'
      - 'src/worldgen/ultrares.py'
      - 'src/worldgen/local_hydrology.py'
      - 'src/worldgen/local_geomorphology.py'
      - 'tests/test_ultrares.py'
      - 'tests/test_local_hydrology.py'
      - 'tests/test_local_geomorphology.py'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_MAX_THREADS: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install validation stack
        run: |
          set -euxo pipefail
          python -m pip install --disable-pip-version-check -e '.[performance,jit,storage,thermodynamics,render,dev]'
          python -m pip check
      - name: Compile changed modules
        run: |
          set -euxo pipefail
          python -m py_compile src/worldgen/ultrares.py src/worldgen/local_hydrology.py src/worldgen/local_geomorphology.py
      - name: Run focused regression suite
        run: |
          set -euxo pipefail
          python -m pytest -q             tests/test_ultrares.py             tests/test_local_hydrology.py             tests/test_local_geomorphology.py
