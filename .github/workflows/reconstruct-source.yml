name: Reconstruct complete source

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  reconstruct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify exact source archive
        shell: bash
        run: |
          set -euo pipefail
          test -f .source_payload/chunk_018
          cat .source_payload/chunk_* > /tmp/source.b64
          base64 -d /tmp/source.b64 > /tmp/source.tar.gz
          echo "0c0c0a4cb2164ad8103e4413e613aa2ae09ba7aaa171f078585d0f65d4933851  /tmp/source.tar.gz" | sha256sum -c -
          mkdir /tmp/source-tree
          tar -xzf /tmp/source.tar.gz -C /tmp/source-tree
          test -f /tmp/source-tree/src/worldgen/pipeline.py
          test -f /tmp/source-tree/src/worldgen/tectonics.py
          test -f /tmp/source-tree/src/worldgen/hydrology.py
          test -f /tmp/source-tree/src/worldgen/climate.py
          test -f /tmp/source-tree/src/worldgen/ocean.py
          test -f /tmp/source-tree/src/worldgen/render.py
          test -f /tmp/source-tree/src/worldgen/resources.py
          test -f /tmp/source-tree/src/worldgen/society.py
          test -f /tmp/source-tree/src/worldgen/terrain.py
          test -f /tmp/source-tree/src/worldgen/weather.py

      - name: Replace partial tree with complete implementation
        shell: bash
        run: |
          set -euo pipefail
          cp .github/workflows/reconstruct-source.yml /tmp/reconstruct-source.yml
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/source-tree/. .
          mkdir -p .github/workflows
          cp /tmp/reconstruct-source.yml .github/workflows/reconstruct-source.yml

      - name: Install project and run full tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest
          pytest -q

      - name: Publish complete validated implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to publish"
            exit 0
          fi
          git commit -m "Publish complete validated implementation"
          git push origin HEAD:main
